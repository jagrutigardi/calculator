<!--Final version calculator--!>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- Calculator Section -->
        <div class="calculator">
            <h2>Calculator</h2>
            <input type="text" id="display" disabled>
            
            <div class="buttons">
                <button>C</button>
                <button>(</button>
                <button>)</button>
                <button>/</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>

                <button>0</button>
                <button>.</button>
                <button>=</button>
                <button>DEL</button>
            </div>
        </div>

        <!-- History Section -->
        <div class="history">
            <h2>History</h2>
            <ul id="history-list">
                <li>No history yet...</li>
            </ul>
            <button id="clear-history">Clear History</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
